name: Lint

on:
  workflow_call:

permissions: {}

jobs:
  run:
    name: ${{ matrix.toolchain }}
    runs-on: ubuntu-26.04
    continue-on-error: ${{ matrix.toolchain != 'stable' }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, nightly]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Capture rustc fingerprint
        id: rustc
        run: echo "fingerprint=$(rustc -Vv | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Setup Mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        env:
          MISE_JOBS: 4
        with:
          cache_key_prefix: mise
          cache: true
          experimental: true
          install: true

      - name: Cache Cargo
        if: matrix.toolchain == 'stable'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ steps.rustc.outputs.fingerprint }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-${{ steps.rustc.outputs.fingerprint }}

      - run: cargo clippy --all-targets --all-features
      - run: cargo fmt --check --all
      - run: hk check --all --skip-step no_commit_protected_branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
