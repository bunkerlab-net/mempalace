name: Deny

on:
  workflow_call:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        env:
          MISE_JOBS: 4
        with:
          cache_key_prefix: mise-deny
          cache: true
          experimental: true
          install: true

      - run: mise x cargo:cargo-deny -- cargo deny check bans sources
