name: Deny

on:
  workflow_call:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        env:
          MISE_JOBS: 4
        with:
          cache_key_prefix: mise-deny
          cache: true
          experimental: true
          install: true

      - run: mise x cargo:cargo-deny -- cargo deny check bans sources
