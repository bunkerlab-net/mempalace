name: Lint

on:
  workflow_call:

permissions: {}

jobs:
  run:
    name: ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.toolchain != 'stable' }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, nightly]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Capture rustc fingerprint
        id: rustc
        run: echo "fingerprint=$(rustc -Vv | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Setup Mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        env:
          MISE_JOBS: 4
        with:
          cache_key_prefix: mise
          cache: true
          experimental: true
          install: true

      - name: Cache Cargo
        if: matrix.toolchain == 'stable'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ steps.rustc.outputs.fingerprint }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-${{ steps.rustc.outputs.fingerprint }}

      - run: cargo clippy --all-targets --all-features
      - run: cargo fmt --check --all
      - run: hk check --all --skip-step no_commit_protected_branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
